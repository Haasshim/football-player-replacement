<style>
  :root {
    --bg: #F4F8FF;
    --surface: #FFFFFF;
    --surface-2: #EAF1FF;
    --ink: #151A21;
    --ink-muted: #616B78;
    --ink-faint: #99A2AF;
    --border: #DCE7F7;
    --border-strong: #BFD3F0;
    --accent: #0B63F6;
    --accent-ink: #0847B0;
    --accent-tint: #E4EEFF;
    --candidate: #FF7A1A;
    --candidate-tint: #FFEEDD;
    --pitch: #2E7D4F;
    --pitch-line: rgba(255,255,255,0.3);
    --font-sans: 'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif;
    --font-mono: 'IBM Plex Mono', SFMono-Regular, Menlo, Consolas, monospace;
    --radius: 14px;
    --ease: cubic-bezier(0.34, 1.56, 0.64, 1);
    --accent-rgb: 11,99,246;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1520;
      --surface: #161E2B;
      --surface-2: #1C2636;
      --ink: #EAF1FF;
      --ink-muted: #9FB0C7;
      --ink-faint: #6C7B90;
      --border: #263347;
      --border-strong: #344866;
      --accent: #4C8DFF;
      --accent-ink: #D8E6FF;
      --accent-tint: #142238;
      --candidate: #FFA24D;
      --candidate-tint: #3A2412;
      --pitch: #1F5C3A;
      --pitch-line: rgba(255,255,255,0.18);
      --accent-rgb: 76,141,255;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1520; --surface: #161E2B; --surface-2: #1C2636; --ink: #EAF1FF;
    --ink-muted: #9FB0C7; --ink-faint: #6C7B90; --border: #263347; --border-strong: #344866;
    --accent: #4C8DFF; --accent-ink: #D8E6FF; --accent-tint: #142238;
    --candidate: #FFA24D; --candidate-tint: #3A2412; --pitch: #1F5C3A; --pitch-line: rgba(255,255,255,0.18);
    --accent-rgb: 76,141,255;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  button { font-family: inherit; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
  .topbar {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--surface);
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  }
  .step { font-size: 13px; color: var(--ink-faint); padding: 7px 12px; border-radius: 999px; cursor: default; border: none; background: none; transition: background 0.15s, color 0.15s; }
  .step.reachable { color: var(--ink-muted); cursor: pointer; }
  .step.reachable:hover { background: var(--surface-2); color: var(--ink); }
  .step.active { color: #fff; background: var(--accent); font-weight: 500; }
  .step-sep { color: var(--border-strong); font-size: 12px; }

  h1 { font-size: 20px; font-weight: 500; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-muted); margin: 0 0 20px; }

  .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .team-card {
    text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 10px;
    transition: transform 0.18s var(--ease), box-shadow 0.18s, border-color 0.15s;
    box-shadow: 0 1px 2px rgba(var(--accent-rgb),0.04);
  }
  .team-card:hover { border-color: var(--accent); transform: translateY(-3px) scale(1.015); box-shadow: 0 10px 20px rgba(var(--accent-rgb),0.10); }
  .team-card:active { transform: translateY(-1px) scale(0.995); }
  .team-head { display: flex; align-items: center; gap: 10px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; }
  .badge {
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 500; font-family: var(--font-sans); letter-spacing: 0.2px;
    clip-path: polygon(50% 0%, 100% 20%, 100% 70%, 50% 100%, 0% 70%, 0% 20%);
  }
  .badge.sm { width: 26px; height: 30px; font-size: 10px; }
  .badge.md { width: 34px; height: 39px; font-size: 12px; }
  .badge.lg { width: 44px; height: 50px; font-size: 14px; }
  .team-name { font-size: 14px; font-weight: 500; color: var(--ink); }
  .team-meta { font-size: 12px; color: var(--ink-muted); }
  .bar-track { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 5px; background: var(--accent); border-radius: 3px; transition: width 0.4s var(--ease); }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: 0 1px 3px rgba(var(--accent-rgb),0.05); }
  .panel-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .panel-head .team-name { font-size: 16px; }
  .link-btn { background: none; border: none; color: var(--accent-ink); font-size: 12px; cursor: pointer; padding: 6px 10px; margin-left: auto; border-radius: 999px; transition: background 0.15s; }
  .link-btn:hover { background: var(--accent-tint); }

  .pitch {
    position: relative; margin: 14px 16px 8px; border-radius: var(--radius); overflow: hidden;
    background: var(--pitch); height: 300px;
  }
  .pitch-lines { position: absolute; inset: 0; z-index: 0; }
  .pitch-halfway { position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--pitch-line); }
  .pitch-circle { position: absolute; top: 50%; left: 50%; width: 70px; height: 70px; margin: -35px 0 0 -35px; border: 1px solid var(--pitch-line); border-radius: 50%; }
  .pitch-rows { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: space-between; height: 100%; padding: 12px 8px; }
  .pitch-row { display: flex; justify-content: space-around; }
  .token { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 2px; transition: transform 0.15s var(--ease); }
  .token:hover { transform: translateY(-2px) scale(1.08); }
  .token:active { transform: scale(0.94); }
  .token .circle {
    width: 36px; height: 36px; border-radius: 50%; background: var(--surface); color: var(--ink);
    font-size: 12px; font-weight: 500; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.18), 0 0 0 0 transparent;
    transition: box-shadow 0.2s var(--ease);
  }
  .token.selected .circle { box-shadow: 0 2px 5px rgba(0,0,0,0.18), 0 0 0 3px var(--accent); }
  .token .label { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.35); font-size: 10px; max-width: 58px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .section-label { padding: 12px 16px 4px; color: var(--ink-muted); font-size: 12px; }
  .bench-list { display: flex; gap: 8px; padding: 0 16px 14px; flex-wrap: wrap; }
  .bench-chip {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px;
    cursor: pointer; color: var(--ink); font-size: 12px; display: flex; align-items: center; gap: 6px;
    transition: transform 0.15s var(--ease), border-color 0.15s;
  }
  .bench-chip:hover { transform: translateY(-1px); border-color: var(--candidate); }
  .bench-chip.selected { box-shadow: 0 0 0 2px var(--candidate); border-color: transparent; }
  .bench-pos { color: var(--candidate); font-family: var(--font-mono); font-size: 10px; }

  .search-block { padding: 4px 16px 14px; }
  .search-input {
    width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface-2); color: var(--ink); font-size: 13px; font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  .search-results { margin-top: 8px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .search-result-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 14px;
    cursor: pointer; border-bottom: 1px solid var(--border); background: var(--surface);
    transition: background 0.12s;
  }
  .search-result-row:last-child { border-bottom: none; }
  .search-result-row:hover { background: var(--accent-tint); }
  .search-result-name { font-size: 12px; color: var(--ink); }
  .search-result-meta { font-size: 11px; color: var(--ink-muted); }

  .selection-strip { display: flex; gap: 12px; margin: 0 16px 14px; padding: 10px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); }
  .selection-col { flex: 1; }
  .selection-label { font-size: 10px; color: var(--ink-muted); margin-bottom: 2px; }
  .selection-value { font-size: 12px; font-weight: 500; color: var(--ink); }
  .selection-col.right { text-align: right; }

  .primary-btn {
    display: block; width: calc(100% - 32px); margin: 0 16px 16px; padding: 12px; border: none; border-radius: 999px;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 500; cursor: pointer;
    transition: transform 0.15s var(--ease), box-shadow 0.15s;
    box-shadow: 0 4px 10px rgba(var(--accent-rgb),0.25);
  }
  .primary-btn:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(var(--accent-rgb),0.32); }
  .primary-btn:not(:disabled):active { transform: translateY(0) scale(0.98); }
  .primary-btn:disabled { opacity: 0.35; cursor: default; box-shadow: none; }
  .secondary-btn {
    display: block; width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--ink); font-size: 13px; cursor: pointer; transition: background 0.15s, transform 0.15s var(--ease);
  }
  .secondary-btn:hover { background: var(--surface-2); transform: translateY(-1px); }

  .compare-head { display: flex; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--border); }
  .compare-name { font-size: 14px; font-weight: 500; }
  .compare-meta { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
  .compare-side.right { text-align: right; }

  .score-block { display: flex; justify-content: center; gap: 28px; padding: 22px 0; border-bottom: 1px solid var(--border); }
  .score-item { display: flex; flex-direction: column; align-items: center; }
  .score-label { font-size: 11px; color: var(--ink-muted); margin-top: 6px; }

  .stat-row { padding: 10px 16px; }
  .stat-values { display: flex; justify-content: space-between; margin-bottom: 5px; }
  .stat-values span { font-size: 12px; font-family: var(--font-mono); color: var(--ink); }
  .stat-name { font-size: 11px; color: var(--ink-muted); font-family: var(--font-sans); }
  .diverge { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; }
  .diverge-half { width: 50%; display: flex; }
  .diverge-half.left { justify-content: flex-end; }
  .diverge-half.right { justify-content: flex-start; }
  .diverge-fill { height: 6px; border-radius: 3px; transition: width 0.35s var(--ease); }
  .diverge-fill.a { background: var(--accent); }
  .diverge-fill.b { background: var(--candidate); }

  .btn-row { display: flex; gap: 8px; padding: 14px 16px; }
  .btn-row .primary-btn, .btn-row .secondary-btn { margin: 0; width: auto; flex: 1; }

  .empty-hint { padding: 24px 16px; color: var(--ink-faint); font-size: 12px; text-align: center; }

  @keyframes pop-in { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .score-pop { animation: pop-in 0.35s var(--ease); }

  .wrap { overflow-x: clip; }
  .page { animation-duration: 0.32s; animation-timing-function: var(--ease); animation-fill-mode: both; }
  .page.enter-forward { animation-name: page-in-forward; }
  .page.enter-back { animation-name: page-in-back; }
  @keyframes page-in-forward { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes page-in-back { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: translateX(0); } }
  @media (prefers-reduced-motion: reduce) {
    .page, .team-card, .token, .bench-chip, .primary-btn, .secondary-btn, .score-pop { animation: none !important; transition: none !important; }
  }
</style>

    var weightedSqDiffSum = 0, weightSum = 0;
    var breakdown = [];
    Object.keys(config).forEach(function (stat) {
      var spec = config[stat];
      var weight = spec.weight, direction = spec.direction || 1;
      var rawA = playerA[stat], rawB = playerB[stat];
      var availableA = typeof rawA === 'number' && !isNaN(rawA);
      var availableB = typeof rawB === 'number' && !isNaN(rawB);
      if (!availableA || !availableB) {
        // stat unavailable for one or both players (real data gap) -
        // skip its contribution rather than treating missing as zero
        breakdown.push({ stat: stat, valA: rawA, valB: rawB, weight: weight, zDiff: null, favored: 'unavailable' });
        return;
      }
      var za = zScore(position, stat, rawA);
      var zb = zScore(position, stat, rawB);
      var sqDiff = (za - zb) * (za - zb);
      weightedSqDiffSum += weight * sqDiff;
      weightSum += weight;
      var favored = 'tie';
      if ((za - zb) * direction > 0) favored = 'a';
      else if ((za - zb) * direction < 0) favored = 'b';
      breakdown.push({ stat: stat, valA: rawA, valB: rawB, weight: weight, zDiff: za - zb, favored: favored });
    });
    var rawDistance = weightSum ? Math.sqrt(weightedSqDiffSum / weightSum) : 0;
    var score = 100 * Math.exp(-rawDistance / 1.4);
    score = Math.max(0, Math.min(100, score));
    breakdown.sort(function (a, b) {
      var av = a.zDiff === null ? -1 : a.weight * Math.abs(a.zDiff);
      var bv = b.zDiff === null ? -1 : b.weight * Math.abs(b.zDiff);
      return bv - av;
    });
    return { matchScore: Math.round(score * 10) / 10, breakdown: breakdown };
  }

  function computeLineup(teamPlayers) {
    var used = {};
    var starters = [];
    Object.keys(FORMATION_SLOTS).forEach(function (pos) {
      var count = FORMATION_SLOTS[pos];
      var group = teamPlayers.filter(function (p) { return p.primary_position === pos; })
        .sort(function (a, b) { return b.total_minutes - a.total_minutes; });
      for (var i = 0; i < count && i < group.length; i++) {
        // slot_position is fixed at the formation slot, not the player's own
        // position, so a replacement stays visible in the same pitch row
        // even if the new player's real position differs
        starters.push(Object.assign({}, group[i], { slot_position: pos }));
        used[group[i].player_id] = true;
      }
    });
    var bench = teamPlayers.filter(function (p) { return !used[p.player_id]; });
    return { starters: starters, bench: bench };
  }

  function selectTeam(teamId) {
    var teamPlayers = players.filter(function (p) { return p.club === teamId; });
    var lineup = computeLineup(teamPlayers);
    state.teamId = teamId;
    state.starters = lineup.starters;
    state.bench = lineup.bench;
    state.currentPlayer = null;
    state.candidatePlayer = null;
    state.lastSwap = null;
    state.view = 'squad';
    render();
  }

  function selectCurrent(playerId) {
    state.currentPlayer = state.starters.concat(state.bench).find(function (p) { return p.player_id === playerId; }) || null;
    state.lastSwap = null;
    render();
  }

  function selectCandidate(playerId) {
    state.candidatePlayer = players.find(function (p) { return p.player_id === playerId; }) || null;
    render();
  }

  function goCompare() {
    if (state.currentPlayer && state.candidatePlayer) { state.view = 'compare'; render(); }
  }

  function backToSquad() {
    state.candidatePlayer = null;
    state.view = 'squad';
    render();
  }

  function confirmReplace() {
    var replacedName = state.currentPlayer.full_name;
    var candidateName = state.candidatePlayer.full_name;
    var starterIdx = state.starters.findIndex(function (p) { return p.player_id === state.currentPlayer.player_id; });
    if (starterIdx !== -1) {
      // carry over the fixed pitch slot so the new player shows up in the
      // same row, even if their own position differs from who they replaced
      var slot = state.starters[starterIdx].slot_position;
      state.starters[starterIdx] = Object.assign({}, state.candidatePlayer, { slot_position: slot });
    } else {
      var benchIdx = state.bench.findIndex(function (p) { return p.player_id === state.currentPlayer.player_id; });
      if (benchIdx !== -1) state.bench[benchIdx] = state.candidatePlayer;
    }
    state.currentPlayer = null;
    state.candidatePlayer = null;
    state.view = 'squad';
    state.lastSwap = { replacedName: replacedName, candidateName: candidateName };
    render();
  }

  function goTeams() { state.view = 'teams'; render(); }
  function goSquad() { if (state.teamId) { state.view = 'squad'; render(); } }

  function el(html) {
    var d = document.createElement('div');
    d.innerHTML = html;
    return d.firstElementChild;
  }

  function renderTopbar() {
    var bar = document.getElementById('topbar');
    bar.innerHTML = '';
    var stepsDef = [
      { key: 'teams', label: 'Team', reachable: true },
      { key: 'squad', label: 'Squad', reachable: !!state.teamId },
      { key: 'compare', label: 'Compare', reachable: !!(state.currentPlayer && state.candidatePlayer) }
    ];
    stepsDef.forEach(function (s, i) {
      if (i > 0) bar.appendChild(el('<span class="step-sep">/</span>'));
      var cls = 'step' + (state.view === s.key ? ' active' : (s.reachable ? ' reachable' : ''));
      var btn = el('<button class="' + cls + '">' + s.label + '</button>');
      btn.onclick = function () {
        if (s.key === 'teams') goTeams();
        else if (s.key === 'squad' && s.reachable) goSquad();
        else if (s.key === 'compare' && s.reachable) { state.view = 'compare'; render(); }
      };
      bar.appendChild(btn);
    });
  }

  function renderTeams() {
    var app = document.getElementById('app');
    var sorted = teams.slice().sort(function (a, b) { return a.final_league_position - b.final_league_position; });
    var cards = sorted.map(function (t) {
      var pct = Math.round((t.team_strength_index || 0) * 100);
      return '<div class="team-card" data-team="' + t.team_id + '">' +
        '<div class="team-head">' + teamBadge(t.team_id, 'md') +
        '<div><div class="team-name">' + t.team_name + '</div>' +
        '<div class="team-meta">' + t.final_league_position + getOrdinal(t.final_league_position) + ' · ' + t.points + ' pts</div></div></div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
        '</div>';
    }).join('');
    app.innerHTML = '<div class="page"><h1>Choose a team</h1><p class="subtitle">Pick a squad to explore, then find a replacement for any player.</p>' +
      '<div class="team-grid">' + cards + '</div></div>';
    app.querySelectorAll('.team-card').forEach(function (c) {
      c.onclick = function () { selectTeam(c.getAttribute('data-team')); };
    });
  }

  function getOrdinal(n) {
    var s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return s[(v - 20) % 10] || s[v] || s[0];
  }

  function renderTokenRow(row) {
    var group = state.starters.filter(function (p) { return row.indexOf(p.slot_position) !== -1; });
    var buttons = group.map(function (p) {
      var initials = p.full_name.split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2);
      var selCls = state.currentPlayer && state.currentPlayer.player_id === p.player_id ? ' selected' : '';
      return '<button class="token' + selCls + '" data-player="' + p.player_id + '">' +
        '<div class="circle">' + initials + '</div><div class="label">' + shortName(p.full_name) + '</div></button>';
    }).join('');
    return '<div class="pitch-row">' + buttons + '</div>';
  }

  function shortName(name) {
    var parts = name.split(' ');
    return parts[parts.length - 1];
  }

  function renderSquad() {
    var app = document.getElementById('app');
    var team = teamLookup[state.teamId];

    var pitchRows = ROWS.map(renderTokenRow).join('');

    var benchChips = state.bench.map(function (p) {
      var selCls = state.currentPlayer && state.currentPlayer.player_id === p.player_id ? ' selected' : '';
      return '<button class="bench-chip' + selCls + '" data-player="' + p.player_id + '">' +
        '<span class="bench-pos">' + p.primary_position + '</span>' + shortName(p.full_name) + '</button>';
    }).join('');

    var searchResultsHtml = '';
    var searchBoxValue = window.__searchValue || '';
    if (searchBoxValue.length > 0) {
      var q = searchBoxValue.toLowerCase();
      var matches = players.filter(function (p) {
        return p.full_name.toLowerCase().indexOf(q) !== -1 &&
          (!state.currentPlayer || p.player_id !== state.currentPlayer.player_id);
      }).slice(0, 8);
      if (matches.length > 0) {
        searchResultsHtml = '<div class="search-results">' + matches.map(function (p) {
          var t = teamLookup[p.club];
          return '<div class="search-result-row" data-player="' + p.player_id + '">' +
            '<div style="display:flex; align-items:center; gap:10px;">' + teamBadge(p.club, 'sm') +
            '<div><div class="search-result-name">' + p.full_name + dataBadge(p) + '</div>' +
            '<div class="search-result-meta">' + p.primary_position + ' · ' + (t ? t.team_name : p.club) + '</div></div></div>' +
            '</div>';
        }).join('') + '</div>';
      } else {
        searchResultsHtml = '<div class="empty-hint">No players match that search.</div>';
      }
    }

    var selectionHtml = '';
    if (state.currentPlayer || state.candidatePlayer) {
      selectionHtml = '<div class="selection-strip">' +
        '<div class="selection-col"><div class="selection-label">current</div>' +
        '<div class="selection-value">' + (state.currentPlayer ? state.currentPlayer.full_name : 'tap a starting player') + '</div></div>' +
        '<div class="selection-col right"><div class="selection-label">candidate</div>' +
        '<div class="selection-value">' + (state.candidatePlayer ? state.candidatePlayer.full_name : 'search below') + '</div></div>' +
        '</div>';
    }

    var swapBannerHtml = '';
    if (state.lastSwap) {
      swapBannerHtml = '<div style="padding:10px 16px; background:var(--accent-tint); border-bottom:1px solid var(--border); font-size:12px; color:var(--accent-ink);">' +
        'Replaced <strong style="font-weight:500;">' + state.lastSwap.replacedName + '</strong> with <strong style="font-weight:500;">' + state.lastSwap.candidateName + '</strong></div>';
    }

    app.innerHTML =
      '<div class="page"><div class="panel">' +
      '<div class="panel-head">' + teamBadge(state.teamId, 'sm') +
      '<div class="team-name">' + team.team_name + '</div>' +
      '<button class="link-btn" id="change-team">Change team</button></div>' +
      swapBannerHtml +
      '<div class="pitch"><div class="pitch-lines"><div class="pitch-halfway"></div><div class="pitch-circle"></div></div>' +
      '<div class="pitch-rows">' + pitchRows + '</div></div>' +
      '<div class="section-label">Bench &amp; reserves</div>' +
      '<div class="bench-list">' + benchChips + '</div>' +
      '<div class="section-label">Compare against any player in the database</div>' +
      '<div class="search-block"><input class="search-input" id="search-input" type="text" placeholder="Search a player by name" value="' + escapeAttr(searchBoxValue) + '">' +
      searchResultsHtml + '</div>' +
      selectionHtml +
      '<button class="primary-btn" id="compare-btn" ' + (!(state.currentPlayer && state.candidatePlayer) ? 'disabled' : '') + '>Compare selected players</button>' +
      '</div></div>';

    app.querySelector('#change-team').onclick = goTeams;
    app.querySelectorAll('.token').forEach(function (t) { t.onclick = function () { selectCurrent(t.getAttribute('data-player')); }; });
    app.querySelectorAll('.bench-chip').forEach(function (t) { t.onclick = function () { selectCurrent(t.getAttribute('data-player')); }; });
    var input = app.querySelector('#search-input');
    input.oninput = function (e) { window.__searchValue = e.target.value; renderSquad(); refocusSearch(); };
    app.querySelectorAll('.search-result-row').forEach(function (r) {
      r.onclick = function () { selectCandidate(r.getAttribute('data-player')); window.__searchValue = ''; };
    });
    app.querySelector('#compare-btn').onclick = goCompare;
  }

  function refocusSearch() {
    var input = document.getElementById('search-input');
    if (input) { input.focus(); var v = input.value; input.value = ''; input.value = v; }
  }

  function escapeAttr(s) { return (s || '').replace(/"/g, '&quot;'); }

  function renderCompare() {
    var app = document.getElementById('app');
    var a = state.currentPlayer, b = state.candidatePlayer;
    var position = a.primary_position;
    var result = explainScore(a, b, position);
    var score = result.matchScore;
    var chem = computeChemistry(b, state.teamId);

    var rows = result.breakdown.map(function (r) {
      var base = Math.abs(r.valA) + Math.abs(r.valB);
      var pA = base ? (Math.abs(r.valA) / base * 100) : 50;
      var pB = base ? (Math.abs(r.valB) / base * 100) : 50;
      return '<div class="stat-row">' +
        '<div class="stat-values"><span>' + formatValue(r.stat, r.valA) + '</span>' +
        '<span class="stat-name">' + label(r.stat) + '</span>' +
        '<span>' + formatValue(r.stat, r.valB) + '</span></div>' +
        '<div class="diverge"><div class="diverge-half left"><div class="diverge-fill a" style="width:' + pA + '%"></div></div>' +
        '<div class="diverge-half right"><div class="diverge-fill b" style="width:' + pB + '%"></div></div></div>' +
        '</div>';
    }).join('');

    var teamA = teamLookup[a.club], teamB = teamLookup[b.club];

    var chemRing = chem.chemScore === null
      ? '<div class="score-item"><div style="width:64px;height:64px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:11px;">n/a</div><div class="score-label">team fit</div></div>'
      : '<div class="score-item">' + scoreRing(chem.chemScore, 'var(--candidate)', 64) + '<div class="score-label">team fit</div></div>';

    app.innerHTML = '<div class="page"><div class="panel">' +
      '<div class="compare-head">' +
      '<div class="compare-side"><div class="compare-name">' + a.full_name + dataBadge(a) + '</div>' +
      '<div class="compare-meta">' + a.primary_position + ' · ' + (teamA ? teamA.team_name : a.club) + ' · current</div></div>' +
      '<div class="compare-side right"><div class="compare-name">' + b.full_name + dataBadge(b) + '</div>' +
      '<div class="compare-meta">' + b.primary_position + ' · ' + (teamB ? teamB.team_name : b.club) + ' · candidate</div></div>' +
      '</div>' +
      '<div class="score-block">' +
      '<div class="score-item">' + scoreRing(score, 'var(--accent)', 80) + '<div class="score-label">match score</div></div>' +
      chemRing +
      '</div>' +
      rows +
      '<div class="btn-row"><button class="primary-btn" id="replace-btn">Replace player</button>' +
      '<button class="secondary-btn" id="back-btn">Back to squad</button></div>' +
      '</div></div>';

    app.querySelector('#replace-btn').onclick = confirmReplace;
    app.querySelector('#back-btn').onclick = backToSquad;
  }

  function scoreRing(score, color, size) {
    size = size || 80;
    var r = size * 0.375, c = 2 * Math.PI * r, mid = size / 2;
    var offset = c * (1 - score / 100);
    var fontSize = size >= 80 ? 16 : 13;
    return '<svg class="score-pop" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
      '<circle cx="' + mid + '" cy="' + mid + '" r="' + r + '" fill="none" stroke="var(--border)" stroke-width="6"></circle>' +
      '<circle cx="' + mid + '" cy="' + mid + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="6" ' +
      'stroke-dasharray="' + c + '" stroke-dashoffset="' + offset + '" stroke-linecap="round" ' +
      'transform="rotate(-90 ' + mid + ' ' + mid + ')"></circle>' +
      '<text x="' + mid + '" y="' + (mid + 5) + '" text-anchor="middle" font-size="' + fontSize + '" font-weight="500" fill="var(--ink)" font-family="var(--font-sans)">' + score + '%</text>' +
      '</svg>';
  }

  var VIEW_ORDER = ['teams', 'squad', 'compare'];

  function render() {
    renderTopbar();
    var oldIndex = VIEW_ORDER.indexOf(state._prevView);
    var newIndex = VIEW_ORDER.indexOf(state.view);
    var direction = newIndex >= oldIndex ? 'enter-forward' : 'enter-back';
    if (state.view === 'teams') renderTeams();
    else if (state.view === 'squad') renderSquad();
    else if (state.view === 'compare') renderCompare();
    var pageEl = document.querySelector('#app > .page');
    if (pageEl && state.view !== state._prevView) pageEl.classList.add(direction);
    state._prevView = state.view;
  }

  render();
})();
</script>
</body>
</html>
